services:
  - type: web
    name: heat-check
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Every variable the app reads is documented in the README ("Configuration").
    # Only the ones worth pinning on a deploy are listed here.
    envVars:
      - key: NBA_SOURCE
        value: auto        # cdn.nba.com first, ESPN if it refuses this host; "nba" or "espn" pins one
      - key: LIVE_POLL_INTERVAL_SECONDS
        value: "3"
      - key: TRUST_PROXY
        value: "1"        # Render's proxy appends the real client address to X-Forwarded-For
      - key: LOG_FORMAT
        value: json
